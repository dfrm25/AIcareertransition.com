name: Daily AI news refresh

# Runs every day. A Cursor agent reads official vendor pages and publishes a
# brief only when at least three real updates shipped since the last one.
# Quiet days, a missing CURSOR_API_KEY, or a draft that fails checks change nothing.
on:
  schedule:
    - cron: "0 15 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: weekly-update
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Python dependencies
        run: pip install -r requirements-automation.txt

      - name: Research and publish if there is news
        env:
          CURSOR_API_KEY: ${{ secrets.CURSOR_API_KEY }}
          WEEKLY_MODEL: ${{ vars.WEEKLY_MODEL || 'composer-2.5' }}
        run: python3 scripts/generate_weekly.py

      - name: Run guardrails
        run: python3 scripts/guardrails.py

      - name: Detect changes
        id: diff
        run: |
          if [ -n "$(git status --porcelain)" ]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "No new brief today."
          fi

      - name: Commit and push
        if: steps.diff.outputs.changed == 'true'
        run: |
          git config user.name "aict-content-bot"
          git config user.email "aict-content-bot@users.noreply.github.com"
          git add -A
          git commit -m "chore(content): AI news refresh $(date -u +%Y-%m-%d) [skip ci]"
          git push origin HEAD:main

      - name: Remind about the live deploy
        if: steps.diff.outputs.changed == 'true'
        run: |
          echo "::notice::A new brief is on main. The live site updates when cPanel pulls and deploys (see DEPLOYMENT.md)."
