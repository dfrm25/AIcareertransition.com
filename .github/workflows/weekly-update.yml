name: Weekly AI content update + deploy

on:
  schedule:
    - cron: "0 14 * * 1"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: weekly-update
  cancel-in-progress: false

jobs:
  update-and-deploy:
    runs-on: ubuntu-latest
    env:
      FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Python dependencies
        run: pip install -r requirements-automation.txt || true

      - name: Generate weekly content
        env:
          CURSOR_API_KEY: ${{ secrets.CURSOR_API_KEY }}
          WEEKLY_MODEL: ${{ vars.WEEKLY_MODEL || 'composer-2.5' }}
        run: python3 scripts/generate_weekly.py

      - name: Run guardrails
        run: python3 scripts/guardrails.py

      - name: Detect changes
        id: diff
        run: |
          if [ -n "$(git status --porcelain)" ]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "No changes produced; skipping commit and deploy."
          fi

      - name: Warn if live deploy is not configured
        if: env.FTP_PASSWORD == ''
        run: |
          echo "::warning::FTP_PASSWORD is not set. The weekly brief will land on GitHub only. aicareertransition.com will not update until FTP secrets are added."

      - name: Commit generated content
        if: steps.diff.outputs.changed == 'true'
        run: |
          git config user.name "aict-content-bot"
          git config user.email "aict-content-bot@users.noreply.github.com"
          git add -A
          git commit -m "chore(content): weekly AI update $(date -u +%Y-%m-%d) [skip ci]"
          git push origin HEAD:main

      - name: Deploy to GoDaddy (FTPS)
        if: steps.diff.outputs.changed == 'true' && env.FTP_PASSWORD != ''
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: aicareertransition.com
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ftps
          security: loose
          server-dir: ./
          local-dir: ./
          exclude: |
            **/.git*
            **/.git*/**
            **/.github/**
            **/scripts/**
            **/*.md
            **/*.py
            **/.cpanel.yml
            **/.gitignore
            **/__pycache__/**
            **/.pycache-validate/**
            **/requirements-automation.txt
            **/ai-career-transition-deploy.zip

