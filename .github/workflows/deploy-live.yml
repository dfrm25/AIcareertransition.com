name: Deploy live site

# Pushes to main go live over FTPS. Weekly content uses the same
# FTP step inside weekly-update.yml because GitHub will not start a
# second workflow from a GITHUB_TOKEN commit.
on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: live-deploy
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Skip if FTP secrets are missing
        if: env.FTP_PASSWORD == ''
        run: |
          echo "::warning::FTP_PASSWORD is not set. GitHub updated, but aicareertransition.com was not deployed. Add FTP_USERNAME and FTP_PASSWORD under Settings → Secrets → Actions."

      - name: Find FTP folder and drop a test file
        if: env.FTP_PASSWORD != ''
        env:
          FTP_USER: ${{ secrets.FTP_USERNAME }}
          FTP_PASS: ${{ secrets.FTP_PASSWORD }}
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y lftp
          echo "ok $(date -u +%Y-%m-%dT%H:%M:%SZ)" > github-deploy-ok.txt
          lftp -u "$FTP_USER","$FTP_PASS" aicareertransition.com -e "
            set ssl:verify-certificate no;
            set ftp:ssl-force true;
            set ftp:ssl-protect-data true;
            set net:max-retries 2;
            set net:timeout 30;
            pwd;
            ls;
            put github-deploy-ok.txt;
            ls github-deploy-ok.txt;
            bye
          "
