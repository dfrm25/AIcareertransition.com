name: Deploy live site

# Pushes to main go live over FTPS. Weekly content uses the same
# script inside weekly-update.yml because GitHub will not start a
# second workflow from a GITHUB_TOKEN commit.
on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: live-deploy
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Skip if FTP secrets are missing
        if: env.FTP_PASSWORD == ''
        run: |
          echo "::warning::FTP_PASSWORD is not set. GitHub updated, but aicareertransition.com was not deployed. Add FTP_USERNAME and FTP_PASSWORD under Settings → Secrets → Actions."

      - name: Deploy to GoDaddy (FTPS)
        if: env.FTP_PASSWORD != ''
        env:
          FTP_USER: ${{ secrets.FTP_USERNAME }}
          FTP_PASS: ${{ secrets.FTP_PASSWORD }}
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y lftp
          chmod +x scripts/ftp_deploy.sh
          scripts/ftp_deploy.sh
