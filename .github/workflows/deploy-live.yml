name: Deploy live site

# Manual only. Automatic FTP on push is disabled: the extra FTP
# account cannot safely overwrite live HTML (403/404 risk).
on:
  workflow_dispatch:

concurrency:
  group: live-deploy
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Skip if FTP secrets are missing
        if: env.FTP_PASSWORD == ''
        run: |
          echo "::warning::FTP_PASSWORD is not set."

      - name: Deploy to GoDaddy (FTPS)
        if: env.FTP_PASSWORD != ''
        env:
          FTP_USER: ${{ secrets.FTP_USERNAME }}
          FTP_PASS: ${{ secrets.FTP_PASSWORD }}
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y lftp
          chmod +x scripts/ftp_deploy.sh
          scripts/ftp_deploy.sh
